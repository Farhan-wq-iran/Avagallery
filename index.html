<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>آوا گالری ✨</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,"Segoe UI",sans-serif;
}

body{
    background:#180e0a;
    color:#f5e9dd;
    min-height:100vh;
    overflow-x:hidden;
}

.bg{
    position:fixed;
    inset:0;
    z-index:-1;
    background:
        radial-gradient(circle at 20% 20%,rgba(212,143,56,.18),transparent 40%),
        radial-gradient(circle at 80% 80%,rgba(139,69,19,.25),transparent 50%),
        linear-gradient(145deg,#180d08,#2b1d16 60%,#0d0604);
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:50;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:15px 25px;

    background:rgba(43,29,22,.9);
    backdrop-filter:blur(15px);

    border-bottom:1px solid rgba(243,194,123,.2);
    box-shadow:0 4px 20px rgba(0,0,0,.5);
}

.logo{
    color:#f3c27b;
    font-size:22px;
    font-weight:bold;
}

.btn{
    border:1px solid #f3c27b;
    background:#3b261b;
    color:#f5e9dd;

    padding:9px 16px;
    border-radius:20px;

    cursor:pointer;
    transition:.25s;
}

.btn:hover{
    background:#f3c27b;
    color:#2b1d16;
}

/* MAIN */

.container{
    width:min(1100px,94%);
    margin:30px auto;
}

/* HERO */

.hero{
    text-align:center;
    padding:40px 20px;
    margin-bottom:25px;

    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    border-radius:25px;

    backdrop-filter:blur(10px);
}

.hero h1{
    color:#f3c27b;
    font-size:30px;
    margin-bottom:10px;
}

.hero p{
    opacity:.75;
    font-size:14px;
}

/* STATUS */

.status{
    display:flex;
    justify-content:space-between;
    gap:10px;

    padding:12px 15px;
    margin-bottom:20px;

    background:rgba(0,0,0,.25);
    border:1px solid rgba(243,194,123,.1);
    border-radius:12px;

    font-size:12px;
}

/* FILTERS */

.filters{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;

    margin-bottom:25px;
}

.filter{
    padding:9px 18px;

    border-radius:12px;
    border:1px solid rgba(243,194,123,.25);

    background:#3b261b;
    color:#f5e9dd;

    cursor:pointer;
}

.filter.active,
.filter:hover{
    background:#f3c27b;
    color:#2b1d16;
}

/* ADMIN */

.admin-panel{
    display:none;

    padding:15px;
    margin-bottom:25px;

    background:rgba(255,255,255,.04);
    border:1px solid rgba(243,194,123,.2);
    border-radius:15px;
}

.admin-panel.show{
    display:block;
}

.admin-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.add-admin{
    background:#27ae60;
    border:none;
}

.stats-admin{
    background:#8e44ad;
    border:none;
}

/* PRODUCTS */

.products{
    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(240px,1fr));

    gap:22px;
}

.card{
    display:flex;
    flex-direction:column;
    justify-content:space-between;

    padding:15px;

    background:rgba(43,29,22,.65);

    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;

    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);

    border-color:rgba(243,194,123,.5);

    box-shadow:0 10px 25px rgba(0,0,0,.5);
}

.product-image{
    width:100%;
    height:190px;

    object-fit:cover;

    border-radius:13px;
    margin-bottom:12px;

    background:#2b1d16;
}

.product-title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:7px;
}

.product-category{
    color:#f3c27b;
    font-size:11px;
    margin-bottom:8px;
}

.product-description{
    font-size:12px;
    opacity:.7;
    line-height:1.6;
    min-height:38px;
}

.card-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-top:15px;
    padding-top:12px;

    border-top:1px dashed rgba(255,255,255,.1);
}

.price{
    color:#f3c27b;
    font-weight:bold;
}

.delete{
    border:none;
    background:#e74c3c;
    color:white;

    padding:7px 10px;
    border-radius:8px;

    cursor:pointer;
}

/* MODAL */

.modal{
    display:none;

    position:fixed;
    inset:0;
    z-index:100;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.8);
    backdrop-filter:blur(7px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(450px,100%);
    max-height:90vh;
    overflow:auto;

    padding:25px;

    background:#23140e;

    border:1px solid #f3c27b;
    border-radius:20px;

    box-shadow:0 0 40px rgba(0,0,0,.8);
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:20px;
    padding-bottom:12px;

    border-bottom:1px solid rgba(255,255,255,.1);
}

.close{
    border:none;
    background:none;

    color:white;
    font-size:22px;

    cursor:pointer;
}

.input{
    margin-bottom:14px;
}

.input label{
    display:block;

    color:#f3c27b;
    font-size:12px;

    margin-bottom:6px;
}

.input input,
.input textarea,
.input select{
    width:100%;

    padding:11px;

    border-radius:9px;

    border:1px solid rgba(243,194,123,.3);

    background:rgba(0,0,0,.4);

    color:white;
}

.input select option{
    background:#23140e;
}

.submit{
    width:100%;

    padding:12px;

    border:none;
    border-radius:10px;

    background:#f3c27b;
    color:#2b1d16;

    font-weight:bold;

    cursor:pointer;
}

/* STATS */

.stats-box{
    background:#0d0604;

    border:1px solid #f3c27b;
    border-radius:10px;

    padding:15px;

    color:#a6e22e;

    font-family:monospace;
    font-size:12px;

    white-space:pre-wrap;
}

/* EMPTY */

.empty{
    grid-column:1/-1;

    text-align:center;
    padding:50px;

    opacity:.6;
}

/* MOBILE */

@media(max-width:600px){

    header{
        padding:12px 15px;
    }

    .logo{
        font-size:18px;
    }

    .hero h1{
        font-size:24px;
    }

    .status{
        flex-direction:column;
    }

    .products{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- HEADER -->

<header>

    <div class="logo">
        💎 آوا گالری
    </div>

    <button
        class="btn"
        id="loginButton"
        onclick="openLogin()">

        🔐 ورود مدیر

    </button>

</header>


<main class="container">

    <!-- HERO -->

    <section class="hero">

        <h1>
            به آوا گالری خوش آمدید ✨
        </h1>

        <p>
            جدیدترین و شیک‌ترین محصولات آوا گالری
        </p>

    </section>


    <!-- STATUS -->

    <div class="status">

        <span id="syncStatus">
            🟢 فروشگاه آماده است
        </span>

        <span id="roleStatus">
            نقش فعلی: کاربر عادی
        </span>

    </div>


    <!-- FILTER -->

    <div class="filters">

        <button
            class="filter active"
            onclick="filterProducts('all',this)">

            همه محصولات

        </button>

        <button
            class="filter"
            onclick="filterProducts('زیورآلات',this)">

            زیورآلات

        </button>

        <button
            class="filter"
            onclick="filterProducts('ساعت',this)">

            ساعت

        </button>

        <button
            class="filter"
            onclick="filterProducts('کادویی',this)">

            کادویی

        </button>

    </div>


    <!-- ADMIN PANEL -->

    <section
        class="admin-panel"
        id="adminPanel">

        <div class="admin-buttons">

            <button
                class="btn add-admin"
                onclick="openAddProduct()">

                ➕ افزودن محصول

            </button>

            <button
                class="btn stats-admin"
                onclick="showStats()">

                📊 آمار فروشگاه

            </button>

        </div>

    </section>


    <!-- PRODUCTS -->

    <section
        class="products"
        id="products">

    </section>

</main>


<!-- LOGIN -->

<div
    class="modal"
    id="loginModal">

    <div class="modal-box">

        <div class="modal-header">

            <h3>
                🔐 ورود مدیر
            </h3>

            <button
                class="close"
                onclick="closeModal('loginModal')">

                ✕

            </button>

        </div>


        <div class="input">

            <label>
                نام کاربری
            </label>

            <input
                id="username"
                type="text"
                placeholder="نام کاربری">

        </div>


        <div class="input">

            <label>
                رمز عبور
            </label>

            <input
                id="password"
                type="password"
                placeholder="رمز عبور">

        </div>


        <button
            class="submit"
            onclick="login()">

            ورود به پنل

        </button>

    </div>

</div>


<!-- ADD PRODUCT -->

<div
    class="modal"
    id="addModal">

    <div class="modal-box">

        <div class="modal-header">

            <h3>
                ➕ افزودن محصول
            </h3>

            <button
                class="close"
                onclick="closeModal('addModal')">

                ✕

            </button>

        </div>


        <div class="input">

            <label>
                نام محصول
            </label>

            <input
                id="productName"
                type="text"
                placeholder="مثلاً گردنبند طلا">

        </div>


        <div class="input">

            <label>
                قیمت
            </label>

            <input
                id="productPrice"
                type="number"
                placeholder="مثلاً 1500000">

        </div>


        <div class="input">

            <label>
                دسته‌بندی
            </label>

            <select id="productCategory">

                <option value="زیورآلات">
                    زیورآلات
                </option>

                <option value="ساعت">
                    ساعت
                </option>

                <option value="کادویی">
                    کادویی
                </option>

            </select>

        </div>


        <div class="input">

            <label>
                لینک تصویر
            </label>

            <input
                id="productImage"
                type="url"
                placeholder="https://...">

        </div>


        <div class="input">

            <label>
                توضیحات
            </label>

            <textarea
                id="productDescription"
                rows="3"
                placeholder="توضیحات محصول..."></textarea>

        </div>


        <button
            class="submit"
            onclick="addProduct()">

            ثبت محصول 🚀

        </button>

    </div>

</div>


<!-- STATS -->

<div
    class="modal"
    id="statsModal">

    <div class="modal-box">

        <div class="modal-header">

            <h3>
                📊 آمار فروشگاه
            </h3>

            <button
                class="close"
                onclick="closeModal('statsModal')">

                ✕

            </button>

        </div>

        <div
            class="stats-box"
            id="stats">

        </div>

    </div>

</div>


<script>

/* =========================
   تنظیمات
========================= */

const ADMIN_USERNAME = "Haghighi";
const ADMIN_PASSWORD = "Haghighi";


let isAdmin = false;


/* =========================
   محصولات پیش‌فرض
========================= */

const defaultProducts = [

    {
        id: "1",

        name: "گردنبند طلا طرح آوا",

        price: 1250000,

        category: "زیورآلات",

        image:
        "https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=600",

        description:
        "طراحی شیک و ظریف، مناسب هدیه به عزیزان"
    },


    {
        id: "2",

        name: "ساعت کلاسیک زنانه",

        price: 2100000,

        category: "ساعت",

        image:
        "https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=600",

        description:
        "ساعت کلاسیک و زیبا برای استفاده روزمره"
    },


    {
        id: "3",

        name: "جعبه کادویی لوکس",

        price: 650000,

        category: "کادویی",

        image:
        "https://images.unsplash.com/photo-1512909006721-3d6018887383?w=600",

        description:
        "یک انتخاب زیبا برای مناسبت‌های خاص"
    }

];


/* =========================
   دریافت محصولات
========================= */

let products;

try{

    const saved =
        localStorage.getItem(
            "ava_gallery_products"
        );

    products =
        saved
        ? JSON.parse(saved)
        : defaultProducts;

}
catch(error){

    products = defaultProducts;

}


/* =========================
   ذخیره
========================= */

function saveProducts(){

    localStorage.setItem(
        "ava_gallery_products",
        JSON.stringify(products)
    );

    document
        .getElementById("syncStatus")
        .textContent =
        "🟢 اطلاعات ذخیره شد";

}


/* =========================
   نمایش محصولات
========================= */

function renderProducts(list){

    const container =
        document.getElementById("products");


    if(!list.length){

        container.innerHTML =
        `
        <div class="empty">
            محصولی پیدا نشد 😕
        </div>
        `;

        return;
    }


    container.innerHTML =
        list.map(product => {

            const image =
                product.image ||
                "https://placehold.co/600x400/2b1d16/f3c27b?text=Ava+Gallery";


            return `

            <article class="card">

                <div>

                    <img
                        class="product-image"
                        src="${escapeHTML(image)}"
                        alt="${escapeHTML(product.name)}"

                        onerror="
                            this.src='https://placehold.co/600x400/2b1d16/f3c27b?text=Ava+Gallery'
                        "
                    >

                    <div class="product-title">
                        ${escapeHTML(product.name)}
                    </div>

                    <div class="product-category">
                        دسته: ${escapeHTML(product.category)}
                    </div>

                    <div class="product-description">
                        ${escapeHTML(product.description || "بدون توضیحات")}
                    </div>

                </div>


                <div class="card-footer">

                    <span class="price">
                        ${Number(product.price).toLocaleString("fa-IR")}
                        تومان
                    </span>


                    ${
                        isAdmin
                        ?
                        `
                        <button
                            class="delete"
                            onclick="deleteProduct('${product.id}')">

                            🗑 حذف

                        </button>
                        `
                        :
                        ""
                    }

                </div>

            </article>

            `;

        }).join("");

}


/* =========================
   ضد XSS
========================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   فیلتر
========================= */

function filterProducts(category,button){

    document
        .querySelectorAll(".filter")
        .forEach(btn =>
            btn.classList.remove("active")
        );


    button.classList.add("active");


    if(category === "all"){

        renderProducts(products);

    }
    else{

        renderProducts(
            products.filter(
                product =>
                product.category === category
            )
        );

    }

}


/* =========================
   ورود
========================= */

function openLogin(){

    document
        .getElementById("loginModal")
        .classList.add("show");

}


function login(){

    const username =
        document
        .getElementById("username")
        .value
        .trim();


    const password =
        document
        .getElementById("password")
        .value;


    if(
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
    ){

        isAdmin = true;


        document
            .getElementById("adminPanel")
            .classList.add("show");


        document
            .getElementById("loginButton")
            .style.display = "none";


        document
            .getElementById("roleStatus")
            .textContent =
            "نقش فعلی: مدیر سیستم 🔓";


        closeModal("loginModal");


        renderProducts(products);


        alert(
            "ورود موفق بود! 🎉"
        );

    }
    else{

        alert(
            "نام کاربری یا رمز عبور اشتباه است ❌"
        );

    }

}


/* =========================
   افزودن محصول
========================= */

function openAddProduct(){

    if(!isAdmin)
        return;


    document
        .getElementById("addModal")
        .classList.add("show");

}


function addProduct(){

    if(!isAdmin)
        return;


    const name =
        document
        .getElementById("productName")
        .value
        .trim();


    const price =
        Number(
            document
            .getElementById("productPrice")
            .value
        );


    const category =
        document
        .getElementById("productCategory")
        .value;


    const image =
        document
        .getElementById("productImage")
        .value
        .trim();


    const description =
        document
        .getElementById("productDescription")
        .value
        .trim();


    if(!name){

        alert(
            "نام محصول را وارد کن."
        );

        return;

    }


    if(!Number.isFinite(price) || price < 0){

        alert(
            "قیمت محصول درست نیست."
        );

        return;

    }


    const newProduct = {

        id:
            Date.now().toString(),

        name:
            name,

        price:
            price,

        category:
            category,

        image:
            image,

        description:
            description

    };


    products.unshift(
        newProduct
    );


    saveProducts();


    renderProducts(products);


    /* پاک کردن فرم */

    document
        .getElementById("productName")
        .value = "";

    document
        .getElementById("productPrice")
        .value = "";

    document
        .getElementById("productImage")
        .value = "";

    document
        .getElementById("productDescription")
        .value = "";


    closeModal(
        "addModal"
    );


    alert(
        "محصول با موفقیت اضافه شد ✅"
    );

}


/* =========================
   حذف
========================= */

function deleteProduct(id){

    if(!isAdmin)
        return;


    const answer =
        confirm(
            "آیا مطمئنی می‌خواهی این محصول حذف شود؟"
        );


    if(!answer)
        return;


    products =
        products.filter(
            product =>
            product.id !== id
        );


    saveProducts();


    renderProducts(products);

}


/* =========================
   آمار
========================= */

function showStats(){

    if(!isAdmin)
        return;


    const total =
        products.reduce(
            (sum,product) =>
            sum + Number(product.price),
            0
        );


    const average =
        products.length
        ?
        Math.round(
            total / products.length
        )
        :
        0;


    const categories = {

        "زیورآلات":0,
        "ساعت
