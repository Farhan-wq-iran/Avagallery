<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>آوا گالری ✨</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma,"Segoe UI",sans-serif;
}

body{
    background:#180e0a;
    color:#f5e9dd;
    min-height:100vh;
    padding-bottom:50px;
    overflow-x:hidden;
}

.bg-glow{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%,rgba(212,143,56,.15),transparent 40%),
        radial-gradient(circle at 80% 80%,rgba(139,69,19,.25),transparent 50%),
        linear-gradient(145deg,#180d08,#2b1d16 60%,#0d0604);
    z-index:-1;
}

header{
    background:rgba(43,29,22,.9);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(243,194,123,.2);
    position:sticky;
    top:0;
    z-index:100;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 4px 20px rgba(0,0,0,.5);
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#f3c27b;
    text-shadow:0 0 12px rgba(243,194,123,.4);
}

.nav-btns{
    display:flex;
    gap:10px;
    align-items:center;
}

.btn{
    background:linear-gradient(135deg,#3b261b,#4a3022);
    border:1px solid #f3c27b;
    color:#f5e9dd;
    padding:8px 16px;
    border-radius:20px;
    cursor:pointer;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:6px;
    transition:.3s;
}

.btn:hover{
    background:#f3c27b;
    color:#2b1d16;
}

.cart-badge{
    background:#e74c3c;
    color:white;
    font-size:11px;
    width:18px;
    height:18px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:0 20px;
}

.hero{
    text-align:center;
    padding:35px 20px;
    background:rgba(255,255,255,.03);
    border-radius:24px;
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    margin-bottom:30px;
}

.hero h1{
    font-size:30px;
    color:#f3c27b;
    margin-bottom:8px;
}

.hero p{
    opacity:.8;
    font-size:14px;
}

.status-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(0,0,0,.3);
    padding:10px 15px;
    border-radius:10px;
    margin-bottom:20px;
    font-size:12px;
    border:1px solid rgba(243,194,123,.1);
}

.filters{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:30px;
}

.filter-btn{
    background:rgba(59,38,27,.6);
    border:1px solid rgba(243,194,123,.2);
    color:#f5e9dd;
    padding:8px 18px;
    border-radius:12px;
    cursor:pointer;
    transition:.3s;
    font-size:13px;
}

.filter-btn.active,
.filter-btn:hover{
    background:#f3c27b;
    color:#2b1d16;
    border-color:#f3c27b;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:22px;
}

.card{
    background:rgba(43,29,22,.6);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:16px;
    transition:.3s;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.card:hover{
    transform:translateY(-6px);
    border-color:rgba(243,194,123,.5);
    box-shadow:0 10px 25px rgba(0,0,0,.6);
}

.card-img{
    width:100%;
    height:180px;
    border-radius:12px;
    object-fit:cover;
    margin-bottom:12px;
    background:#2b1d16;
}

.card-title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:6px;
}

.card-cat{
    font-size:11px;
    color:#f3c27b;
    opacity:.8;
    margin-bottom:8px;
}

.card-desc{
    font-size:12px;
    opacity:.7;
    line-height:1.5;
    margin-bottom:15px;
}

.card-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:auto;
    padding-top:10px;
    border-top:1px dashed rgba(255,255,255,.1);
}

.price{
    color:#f3c27b;
    font-weight:bold;
    font-size:15px;
}

.add-btn{
    background:#f3c27b;
    color:#2b1d16;
    border:none;
    padding:8px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    font-size:12px;
}

.delete-btn{
    background:#e74c3c;
    color:white;
    border:none;
    padding:6px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:11px;
    margin-right:5px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    backdrop-filter:blur(8px);
    z-index:200;
    align-items:center;
    justify-content:center;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:#23140e;
    border:1px solid #f3c27b;
    width:min(450px,92vw);
    max-height:90vh;
    overflow:auto;
    border-radius:20px;
    padding:24px;
    box-shadow:0 0 40px rgba(0,0,0,.9);
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,.1);
    padding-bottom:12px;
    margin-bottom:15px;
}

.close-btn{
    background:none;
    border:none;
    color:white;
    font-size:22px;
    cursor:pointer;
}

.input-group{
    margin-bottom:12px;
}

.input-group label{
    display:block;
    font-size:12px;
    margin-bottom:5px;
    color:#f3c27b;
}

.input-group input,
.input-group textarea,
.input-group select{
    width:100%;
    padding:10px;
    background:rgba(0,0,0,.4);
    border:1px solid rgba(243,194,123,.3);
    border-radius:8px;
    color:white;
    font-size:13px;
}

.input-group select option{
    background:#23140e;
}

.submit-btn{
    width:100%;
    background:#f3c27b;
    color:#2b1d16;
    border:none;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    font-size:13px;
    background:rgba(255,255,255,.03);
    padding:8px 12px;
    border-radius:8px;
}

.cpp-output{
    background:#0d0604;
    border:1px solid #f3c27b;
    border-radius:8px;
    padding:12px;
    font-family:monospace;
    font-size:12px;
    color:#a6e22e;
    white-space:pre-wrap;
    max-height:300px;
    overflow:auto;
}

.empty{
    text-align:center;
    opacity:.7;
    padding:40px;
}

@media(max-width:600px){
    header{
        padding:12px 14px;
    }

    .logo{
        font-size:18px;
    }

    .btn{
        padding:7px 10px;
    }

    .hero h1{
        font-size:24px;
    }

    .status-bar{
        flex-direction:column;
        gap:7px;
    }

    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="bg-glow"></div>

<header>

<div class="logo">
💎 آوا گالری
</div>

<div class="nav-btns">

<button
class="btn"
id="adminBtn"
onclick="toggleAdminModal()">
🔐 ورود مدیر
</button>

<button
class="btn"
id="openCart">
🛒 سبد خرید
<span class="cart-badge" id="cartBadge">0</span>
</button>

</div>

</header>

<div class="container">

<div class="hero">

<h1>
به آوا گالری خوش آمدید
</h1>

<p>
کالکشن جدیدترین و شیک‌ترین محصولات ✨
</p>

</div>

<div class="status-bar">

<span id="syncStatus">
🟢 فروشگاه آماده است
</span>

<span id="roleStatus">
نقش فعلی: کاربر عادی
</span>

</div>

<div class="filters">

<button
class="filter-btn active"
onclick="filterData('all',this)">
همه محصولات
</button>

<button
class="filter-btn"
onclick="filterData('زیورآلات',this)">
زیورآلات
</button>

<button
class="filter-btn"
onclick="filterData('ساعت',this)">
ساعت
</button>

<button
class="filter-btn"
onclick="filterData('کادویی',this)">
کادویی
</button>

</div>

<div
id="adminPanel"
style="display:none;margin-bottom:25px">

<button
class="btn"
style="background:#27ae60;border:none"
onclick="openAddModal()">
➕ افزودن محصول جدید
</button>

<button
class="btn"
style="background:#8e44ad;border:none;margin-top:10px"
onclick="runCppCore()">
⚡ آمار فروشگاه
</button>

</div>

<div
class="grid"
id="productsGrid">
</div>

</div>


<!-- LOGIN -->

<div
class="modal"
id="loginModal">

<div class="modal-box">

<div class="modal-head">

<h3>
🔐 ورود به پنل مدیریت
</h3>

<button
class="close-btn"
onclick="closeModal('loginModal')">
✕
</button>

</div>

<div class="input-group">

<label>
نام کاربری
</label>

<input
type="text"
id="adminUser"
placeholder="نام کاربری">

</div>

<div class="input-group">

<label>
رمز عبور
</label>

<input
type="password"
id="adminPass"
placeholder="رمز عبور">

</div>

<button
class="submit-btn"
onclick="loginAdmin()">
ورود
</button>

</div>

</div>


<!-- ADD PRODUCT -->

<div
class="modal"
id="addModal">

<div class="modal-box">

<div class="modal-head">

<h3>
➕ افزودن محصول
</h3>

<button
class="close-btn"
onclick="closeModal('addModal')">
✕
</button>

</div>

<div class="input-group">

<label>
عنوان محصول
</label>

<input
type="text"
id="pTitle"
placeholder="مثال: انگشتر طلا">

</div>

<div class="input-group">

<label>
قیمت (تومان)
</label>

<input
type="number"
id="pPrice"
placeholder="1200000">

</div>

<div class="input-group">

<label>
دسته‌بندی
</label>

<select id="pCat">

<option value="زیورآلات">
زیورآلات
</option>

<option value="ساعت">
ساعت
</option>

<option value="کادویی">
کادویی
</option>

</select>

</div>

<div class="input-group">

<label>
آدرس تصویر
</label>

<input
type="url"
id="pImg"
placeholder="https://...">

</div>

<div class="input-group">

<label>
توضیحات
</label>

<textarea
id="pDesc"
rows="3"
placeholder="توضیحات محصول">
</textarea>

</div>

<button
class="submit-btn"
onclick="addProduct()">
ثبت محصول 🚀
</button>

</div>

</div>


<!-- CART -->

<div
class="modal"
id="cartModal">

<div class="modal-box">

<div class="modal-head">

<h3>
🛒 سبد خرید
</h3>

<button
class="close-btn"
onclick="closeModal('cartModal')">
✕
</button>

</div>

<div id="cartItems">
سبد خرید خالی است.
</div>

<div
style="margin-top:15px;font-weight:bold;text-align:left;color:#f3c27b"
id="totalPrice">

جمع کل: ۰ تومان

</div>

<button
class="submit-btn"
onclick="completeOrder()">

تکمیل خرید ✨

</button>

</div>

</div>


<!-- STATISTICS -->

<div
class="modal"
id="cppModal">

<div class="modal-box">

<div class="modal-head">

<h3>
⚡ آمار فروشگاه
</h3>

<button
class="close-btn"
onclick="closeModal('cppModal')">
✕
</button>

</div>

<div
class="cpp-output"
id="cppLog">
</div>

</div>

</div>


<script>

"use strict";


/* جلوگیری از XSS */

function sanitize(str){

    const div=document.createElement("div");

    div.textContent=String(str ?? "");

    return div.innerHTML;

}


/* فرمت قیمت */

function money(number){

    return Number(number).toLocaleString("fa-IR")+" تومان";

}


/* اطلاعات مدیر */

const ADMIN_USER="Haghighi";

const ADMIN_PASS="Haghighi";


let isAdmin=false;

let cart=[];


/* محصولات */

let products=JSON.parse(
    localStorage.getItem("ava_gallery_products")
    || "null"
) || [

{
    id:"1",
    title:"گردنبند طلا طرح آوا",
    price:1250000,
    category:"زیورآلات",
    img:"https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=600",
    desc:"طراحی شیک و ظریف، مناسب هدیه به عزیزان"
},

{
    id:"2",
    title:"ساعت کلاسیک زنانه",
    price:2100000,
    category:"ساعت",
    img:"https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=600",
    desc:"طراحی کلاسیک و زیبا برای استفاده روزمره"
},

{
    id:"3",
    title:"جعبه کادویی لوکس",
    price:650000,
    category:"کادویی",
    img:"https://images.unsplash.com/photo-1512909006721-3d6018887383?w=600",
    desc:"یک انتخاب زیبا برای مناسبت‌های خاص"
}

];


/* ذخیره محصولات */

function saveProducts(){

    localStorage.setItem(
        "ava_gallery_products",
        JSON.stringify(products)
    );

    document.getElementById("syncStatus").innerText=
        "🟢 اطلاعات روی همین دستگاه ذخیره شد";

}


/* نمایش محصولات */

function renderProducts(items){

    const grid=document.getElementById("productsGrid");

    if(items.length===0){

        grid.innerHTML=
            '<div class="empty">محصولی در این دسته وجود ندارد.</div>';

        return;

    }


    grid.innerHTML=items.map(p=>`

        <div class="card">

            <div>

                <img
                    src="${sanitize(p.img)}"
                    alt="${sanitize(p.title)}"
                    class="card-img"
                    onerror="this.src='https://placehold.co/600x400/2b1d16/f3c27b?text=Ava+Gallery'"
                >

                <div class="card-title">
                    ${sanitize(p.title)}
                </div>

                <div class="card-cat">
                    دسته: ${sanitize(p.category)}
                </div>

                <div class="card-desc">
                    ${sanitize(p.desc)}
                </div>

            </div>

            <div class="card-footer">

                <span class="price">
                    ${money(p.price)}
                </span>

                <div>

                    <button
                        class="add-btn"
                        onclick="addToCart('${sanitize(p.id)}')">
                        + افزودن
                    </button>

                    ${
                        isAdmin
                        ?
                        `<button
                            class="delete-btn"
                            onclick="deleteProduct('${sanitize(p.id)}')">
                            🗑
                        </button>`
                        :
                        ""
                    }

                </div>

            </div>

        </div>

    `).join("");

}


/* فیلتر */

function filterData(cat,btn){

    document
        .querySelectorAll(".filter-btn")
        .forEach(b=>b.classList.remove("active"));

    btn.classList.add("active");

    if(cat==="all"){

        renderProducts(products);

    }else{

        renderProducts(
            products.filter(
                p=>p.category===cat
            )
        );

    }

}


/* ورود مدیر */

function toggleAdminModal(){

    document
        .getElementById("loginModal")
        .classList.add("show");

}


function loginAdmin(){

    const user=
        document
        .getElementById("adminUser")
        .value
        .trim();

    const pass=
        document
        .getElementById("adminPass")
        .value;


    if(
        user===ADMIN_USER &&
        pass===ADMIN_PASS
    ){

        isAdmin=true;

        document
        .getElementById("roleStatus")
        .innerText=
        "نقش فعلی: مدیر سیستم 🔓";


        document
        .getElementById("adminPanel")
        .style.display="block";


        document
        .getElementById("adminBtn")
        .style.display="none";


        closeModal("loginModal");

        renderProducts(products);

        alert(
            "ورود موفقیت‌آمیز بود! 🎉"
        );

    }else{

        alert(
            "نام کاربری یا رمز عبور اشتباه است!"
        );

    }

}


/* باز کردن فرم */

function openAddModal(){

    if(!isAdmin)return;

    document
    .getElementById("addModal")
    .classList.add("show");

}


/* اضافه کردن محصول */

function addProduct(){

    if(!isAdmin)return;


    const title=
        document
        .getElementById("pTitle")
        .value
        .trim();


    const price=
        parseInt(
            document
            .getElementById("pPrice")
            .value,
            10
        );


    const category=
        document
        .getElementById("pCat")
        .value;


    const img=
        document
        .getElementById("pImg")
        .value
        .trim()
        ||
        "https://placehold.co/600x400/2b1d16/f3c27b?text=Ava+Gallery";


    const desc=
        document
        .getElementById("pDesc")
        .value
        .trim();


    if(
        !title ||
        Number.isNaN(price) ||
        price<0
    ){

        alert(
            "عنوان و قیمت را درست وارد کن."
        );

        return;

    }


    products.unshift({

        id:Date.now().toString(),

        title:title,

        price:price,

        category:category,

        img:img,

        desc:desc

    });


    saveProducts();

    renderProducts(products);

    closeModal("addModal");


    document.getElementById("pTitle").value="";

    document.getElementById("pPrice").value="";

    document.getElementById("pImg").value="";

    document.getElementById("pDesc").value="";

}


/* حذف */

function deleteProduct(id){

    if(!isAdmin)return;


    if(
        confirm(
            "این محصول حذف شود؟"
        )
    ){

        products=
            products.filter(
                p=>p.id!==id
            );

        saveProducts();

        renderProducts(products);

    }

}


/* سبد خرید */

function addToCart(id){

    const item=
        products.find(
            p=>p.id===id
        );


    if(item){

        cart.push({
            ...item
        });

        updateCart();

        document
        .getElementById("syncStatus")
        .innerText=
        "🛒 محصول به سبد خرید اضافه شد";

    }

}


/* آپدیت سبد */

function updateCart(){

    document
    .getElementById("cartBadge")
    .innerText=cart.length;


    const box=
        document
        .getElementById("cartItems");


    const totalBox=
        document
        .getElementById("totalPrice");


    if(cart.length===0){

        box.innerHTML=
            "سبد خرید خالی است.";

        totalBox.innerText=
            "جمع کل: ۰ تومان";

        return;

    }


    let total=0;


    box.innerHTML=
        cart.map(
            (item,index)=>{

                total+=Number(item.price);


                return `

                <div class="cart-item">

                    <span>
                        ${sanitize(item.title)}
                    </span>

                    <span>

                        ${money(item.price)}

                        <button
                            style="
                            background:none;
                            border:none;
                            color:#e74c3c;
                            cursor:pointer;
                            "
                            onclick="removeFromCart(${index})">
                            ✕
                        </button>

                    </span>

                </div>

                `;

            }
        ).join("");


    totalBox.innerText=
        "جمع کل: "+money(total);

}


/* حذف از سبد */

function removeFromCart(index){

    cart.splice(index,1);

    updateCart();

}


/* ثبت سفارش */

function completeOrder(){

    if(cart.length===0){

        alert(
            "سبد خرید خالی است!"
        );

        return;

    }


    alert(
        "🎉 سفارش شما با موفقیت ثبت شد!\n\nاین نسخه نمایشی است و پرداخت واقعی ندارد."
    );


    cart=[];

    updateCart();

    closeModal("cartModal");

}


/* آمار */

function runCppCore(){

    document
    .getElementById("cppModal")
    .classList.add("show");


    const total=
        products.reduce(
            (a,p)=>a+Number(p.price),
            0
        );


    const count=
        products.length;


    const avg=
        count
        ?
        total/count
        :
        0;


    document
    .getElementById("cppLog")
    .textContent=

`// Ava Gallery Statistics Engine

#include <iostream>

int main() {

    std::cout << "[CORE] Processing Store Data..." << std::endl;

    std::cout << "Total Item Count: ${count}" << std::endl;

    std::cout << "Total Inventory Valuation: ${total.toLocaleString()} Toman" << std::endl;

    std::cout << "Average Item Price: ${avg.toLocaleString(undefined,{
        maximumFractionDigits:0
